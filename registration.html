<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tanderrum – Create Account</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root {
    --primary: #ff6a00;
    --secondary: #f24b09;
    --border: #ddd;
    --dark: #111;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg,#f2f3f6,#f2f0f4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

/* ===== MAIN CONTAINER ===== */
.auth-container {
    max-width: 1000px;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
}

/* ===== LEFT PANEL ===== */
.auth-hero {
    background: linear-gradient(135deg,var(--primary),var(--secondary));
    color: #fff;
    padding: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.auth-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 25px;
}

.auth-logo img {
    width: 35px;
    filter: invert(1);
}

.auth-logo h1 {
    font-size: 20px;
}

.auth-hero h2 {
    font-size: 24px;
    margin-bottom: 12px;
}

.auth-hero p {
    font-size: 14px;
    opacity: .9;
    margin-bottom: 25px;
}

.hero-features li {
    list-style: none;
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    font-size: 13px;
}

.hero-features i {
    background: rgba(255,255,255,.25);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ===== RIGHT PANEL ===== */
.auth-form-panel {
    padding: 35px;
    max-height: 80vh;
    overflow-y: auto;
}

.form-header h2 {
    font-size: 22px;
    margin-bottom: 6px;
}

.form-header p {
    font-size: 13px;
    color: #666;
    margin-bottom: 20px;
}

.form-header a {
    color: var(--primary);
    font-weight: 600;
    text-decoration: none;
}

/* ===== FORM ===== */
.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.form-group {
    margin-bottom: 14px;
}

label {
    display: block;
    font-size: 12px;
    margin-bottom: 5px;
}

.form-control {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 13px;
    background: #f9f9f9;
}

.form-control:focus {
    outline: none;
    border-color: var(--primary);
    background: #fff;
}

.input-with-icon {
    position: relative;
}

.input-with-icon i {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    color: #999;
}

.input-with-icon input {
    padding-left: 32px;
}

.password-toggle {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: none;
    cursor: pointer;
    color: #999;
}

/* ===== BUTTON ===== */
.btn-primary {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg,var(--primary),var(--secondary));
    border: none;
    color: #fff;
    font-size: 14px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
}

.btn-primary:hover {
    box-shadow: 0 10px 25px rgba(255,106,0,.35);
}

/* ===== CHECKBOX ===== */
.checkbox {
    font-size: 12px;
    display: flex;
    gap: 6px;
    align-items: center;
}

.checkbox input {
    accent-color: var(--primary);
}

/* ===== DIVIDER ===== */
.divider {
    text-align: center;
    margin: 18px 0;
    font-size: 11px;
    color: #999;
    position: relative;
}

.divider::before,
.divider::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 45%;
    height: 1px;
    background: var(--border);
}

.divider::before { left: 0; }
.divider::after { right: 0; }

/* ===== SOCIAL ===== */
.social-login {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.social-btn {
    padding: 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    cursor: pointer;
    background: #fff;
    font-size: 13px;
}

.google { color: #db4437; border-color: #db4437; }
.facebook { color: #4267B2; border-color: #4267B2; }

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
    .auth-container {
        grid-template-columns: 1fr;
        max-width: 450px;
    }
    .form-row {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="auth-container">

    <!-- LEFT -->
    <div class="auth-hero">
        <div class="auth-logo">
            <img src="images/vector.png">
            <h1>TANDERRUM<span>.Event</span></h1>
        </div>

        <h2>Join Thousands of Event Enthusiasts</h2>
        <p>Create your account to save events & get recommendations.</p>

        <ul class="hero-features">
            <li><i class="fas fa-ticket-alt"></i> Faster ticket booking</li>
            <li><i class="fas fa-star"></i> Personalized events</li>
            <li><i class="fas fa-bell"></i> Artist notifications</li>
            <li><i class="fas fa-gift"></i> Member discounts</li>
        </ul>
    </div>

    <!-- RIGHT -->
    <div class="auth-form-panel">
        <div class="form-header">
            <h2>Create Account</h2>
            <p>Already have one? <a href="login.html">Sign in</a></p>
        </div>

        <form>

            <div class="form-row">
                <div class="form-group">
                    <label>First Name</label>
                    <input class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input class="form-control" required>
                </div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <div class="input-with-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" class="form-control" required>
                </div>
            </div>

            <div class="form-group">
                <label>Phone</label>
                <div class="input-with-icon">
                    <i class="fas fa-phone"></i>
                    <input type="tel" class="form-control" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="form-control" required>
                </div>
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" class="form-control" required>
            </div>

            <label class="checkbox">
                <input type="checkbox" required>
                I agree to Terms & Privacy Policy
            </label>

            <button class="btn-primary">Create Account</button>

            <div class="divider">or</div>

            <div class="social-login">
                <button class="social-btn google">
                    <i class="fab fa-google"></i> Google
                </button>
                <button class="social-btn facebook">
                    <i class="fab fa-facebook-f"></i> Facebook
                </button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
